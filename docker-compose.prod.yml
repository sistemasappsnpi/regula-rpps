# Deploy de produção do Regula RPPS: MySQL + API (Express/Prisma) + Web (React, servido via
# nginx). Diferente do docker-compose.yml da raiz (que só sobe o MySQL para desenvolvimento local
# contra `npm run dev`), este arquivo builda e sobe os 3 serviços a partir do próprio código-fonte.
#
# Uso:
#   1. cp .env.production.example .env.production
#   2. Preencha MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD, JWT_SECRET (ver comentários no
#      .env.production.example) — o compose recusa subir sem eles.
#   3. docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Primeiro boot: a API aplica as migrations do Prisma, projeta o catálogo normativo (22 critérios
# do CRP + 24 ações do Pró-Gestão) e marca SUPER_ADMIN_EMAIL como Super Admin, tudo
# automaticamente antes de subir (ver apps/api/Dockerfile). Login é 100% via SSO — Microsoft,
# gov.br ou APP CENTRAL (ver seção abaixo) — não existe senha local.

services:
  # MySQL embutido — OPCIONAL. Só sobe se você ativar o profile "local-db" explicitamente:
  #   docker compose --profile local-db --env-file .env.production -f docker-compose.prod.yml up -d --build
  # Pra usar um banco dedicado/externo (recomendado em produção real — ver DATABASE_URL abaixo),
  # não ative esse profile: este serviço simplesmente não sobe, e a API se conecta direto no
  # banco externo. Um dos dois é obrigatório (o embutido OU um externo) — nunca os dois.
  mysql:
    profiles: ["local-db"]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-regula_rpps}
      MYSQL_USER: ${MYSQL_USER:-regula}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    # Em produção o banco real é o externo (DB01); este container é só o plano B e não deve
    # competir por memória com o resto do servidor.
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      # String de conexão completa — aponte pro banco dedicado externo (ex.:
      # mysql://usuario:senha@host-do-banco:3306/previdencianpi_db) ou, se estiver usando o
      # MySQL embutido acima (profile local-db), mysql://regula:SENHA@mysql:3306/regula_rpps.
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env.production — string de conexão completa do MySQL}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env.production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOADS_DIR: /app/apps/api/uploads
      # E-mail marcado como Super Admin no primeiro boot — não tem senha própria, login é 100%
      # via SSO (Microsoft, gov.br ou APP CENTRAL, ver comentário abaixo).
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Login via SSO — Microsoft/gov.br opcionais (botões só aparecem se as credenciais reais
      # forem preenchidas no .env.production, ver .env.production.example); APP CENTRAL é o
      # provedor principal de login/permissionamento. WEB_URL é pra onde o backend redireciona o
      # navegador depois do login — tem que ser a URL pública real do site (com domínio/HTTPS),
      # nunca localhost, uma vez fora do ambiente de dev.
      WEB_URL: ${WEB_URL:-http://localhost}
      CENTRAL_ISSUER: ${CENTRAL_ISSUER:-}
      CENTRAL_CLIENT_ID: ${CENTRAL_CLIENT_ID:-}
      CENTRAL_CLIENT_SECRET: ${CENTRAL_CLIENT_SECRET:-}
      CENTRAL_REDIRECT_URI: ${CENTRAL_REDIRECT_URI:-}
      CENTRAL_TOKEN_URL: ${CENTRAL_TOKEN_URL:-}
      CENTRAL_INTROSPECT_URL: ${CENTRAL_INTROSPECT_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      GOVBR_ENABLED: ${GOVBR_ENABLED:-false}
      GOVBR_ISSUER: ${GOVBR_ISSUER:-}
      GOVBR_CLIENT_ID: ${GOVBR_CLIENT_ID:-}
      GOVBR_CLIENT_SECRET: ${GOVBR_CLIENT_SECRET:-}
      GOVBR_REDIRECT_URI: ${GOVBR_REDIRECT_URI:-}
      GOVBR_AUTO_PROVISION: ${GOVBR_AUTO_PROVISION:-true}
      GOVBR_PROVISION_ACTIVE: ${GOVBR_PROVISION_ACTIVE:-false}
      # Teto de heap do Node abaixo do limite do container: sem isso o processo cresce até o
      # kernel matar o container (OOM) ou até o host inteiro ficar lento.
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - api_uploads:/app/apps/api/uploads
    expose:
      - "3333"
    # O servidor é compartilhado com outros sistemas: a API nunca pode consumir mais que isto.
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql_data:
  api_uploads:
