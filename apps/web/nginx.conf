# Limite por IP na API: um navegador/robô descontrolado leva 429 aqui, sem chegar ao Node.
# $http_x_forwarded_for pega o cliente real quando há outro proxy na frente; sem ele, o IP direto.
map $http_x_forwarded_for $cliente_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $cliente_ip zone=api_por_ip:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mesmo comportamento do proxy do Vite em dev (ver apps/web/vite.config.ts): o frontend
    # sempre chama fetch("/api/..."), nunca uma URL absoluta — o nginx é quem decide pra onde
    # isso vai, sem precisar embutir nenhuma URL de API no build do React.
    location /api/ {
        client_max_body_size 25m; # uploads de PDF (ate 20 MB) e logos do gerador de transparencia
        limit_req zone=api_por_ip burst=60 nodelay;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s; # "renovar todos" e geração de ZIP são lentos
        proxy_pass http://api:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA com rotas no client (react-router) — qualquer caminho que não seja um arquivo real
    # cai no index.html, que decide a rota pelo lado do browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos do build têm hash no nome: o navegador pode guardar por muito tempo (menos requisições).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
